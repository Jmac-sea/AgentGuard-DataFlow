version: "1.0"
servers:
  - id: email
    command: "{python}"
    args: ["-m", "agentguard.mock_mcp.email_server"]
    tools:
      read:
        expose_as: email.read
        category: read

  - id: filesystem
    command: "{python}"
    args: ["-m", "agentguard.mock_mcp.filesystem_server"]
    tools:
      read:
        expose_as: filesystem.read
        category: read

  - id: github
    command: "{python}"
    args: ["-m", "agentguard.mock_mcp.github_server"]
    tools:
      create_issue:
        expose_as: github.create_issue
        category: external_write
